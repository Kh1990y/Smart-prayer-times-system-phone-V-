:root{--bg:#120e0b;--acc:#d1bc9b;--txt:#f4eee0;--glow:44,32,22;--accrgb:209,188,155;--txtrgb:244,238,224;--on:#1a120c}
.th-emerald{--bg:#06130e;--acc:#e3c57f;--txt:#eef3ea;--glow:15,52,38;--accrgb:227,197,127;--txtrgb:238,243,234;--on:#06130e}
.th-dusk{--bg:#0a0e1f;--acc:#f2aa63;--txt:#e9edfb;--glow:26,34,78;--accrgb:242,170,99;--txtrgb:233,237,251;--on:#0a0e1f}
.th-dark{--bg:#0a0a0c;--acc:#c8cdd6;--txt:#ececf0;--glow:36,36,42;--accrgb:200,205,214;--txtrgb:236,236,240;--on:#0a0a0c}
.th-light{--bg:#f4efe4;--acc:#7a5428;--txt:#2b2118;--glow:255,253,247;--accrgb:122,84,40;--txtrgb:43,33,24;--on:#fbf6ea}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0a08;color:#f4eee0;font-family:'ThmanyahSans','Segoe UI',Tahoma,sans-serif;font-synthesis:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.run{overflow:hidden;display:grid;place-items:center}
body.run.clear{background:transparent}
/* ===== البطاقة ===== */
.w{position:relative;overflow:hidden;container-type:size;color:var(--txt);flex:none;
  background:radial-gradient(circle at center,rgba(var(--glow),.85) 0%,var(--bg) 100%),
  repeating-linear-gradient(45deg,rgba(var(--accrgb),.07) 0 1px,transparent 1px 22px),
  repeating-linear-gradient(-45deg,rgba(var(--accrgb),.07) 0 1px,transparent 1px 22px);
  background-color:var(--bg);box-shadow:0 0 0 1px rgba(var(--accrgb),.28) inset}
.w.clear{background:none;box-shadow:none}
.in{--u:min(1cqw,1cqh);width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(var(--u)*6);text-align:center;gap:calc(var(--u)*2);direction:rtl}
.lbl{font-size:calc(var(--u)*7);font-weight:700;color:var(--acc);line-height:1.2}
.nm{font-size:calc(var(--u)*19);font-weight:900;line-height:1.15}
.tm{font-size:calc(var(--u)*13);font-weight:700;color:var(--acc);line-height:1.1}
.cd{font-size:calc(var(--u)*17);font-weight:900;direction:ltr;font-variant-numeric:tabular-nums;line-height:1.1;background:var(--acc);color:var(--on);border-radius:calc(var(--u)*5);padding:calc(var(--u)*1.5) calc(var(--u)*6)}
.sm{font-size:calc(var(--u)*6);font-weight:500;opacity:.85;line-height:1.3}
.ap{font-size:.5em;font-weight:900;margin-inline-start:.15em}
.ltr{direction:ltr;unicode-bidi:isolate}
/* next */
.wide .in.nx,.strip .in.nx{flex-direction:row;justify-content:space-around;gap:calc(var(--u)*6)}
.in.nx .blk{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2)}
.wide .in.nx .nm{font-size:calc(var(--u)*24)}.wide .in.nx .tm{font-size:calc(var(--u)*17)}.wide .in.nx .cd{font-size:calc(var(--u)*22)}
.strip .in.nx{padding:calc(var(--u)*6) calc(var(--u)*10)}
.strip .in.nx .lbl,.strip .in.nx .sm{display:none}
.strip .in.nx .nm{font-size:calc(var(--u)*28)}.strip .in.nx .tm{font-size:calc(var(--u)*24)}.strip .in.nx .cd{font-size:calc(var(--u)*26);border-radius:calc(var(--u)*10);padding:calc(var(--u)*2) calc(var(--u)*8)}
.strip .in.nx .blk{flex-direction:row;gap:calc(var(--u)*8)}
/* table */
.in.tb{justify-content:stretch;align-items:stretch;gap:0;padding:calc(var(--u)*4) calc(var(--u)*6)}
.tb .hd{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*6);color:var(--acc);font-weight:700;padding-bottom:calc(var(--u)*1.5);border-bottom:1px solid rgba(var(--accrgb),.35)}
.tb .rows{flex:1;display:grid;grid-template-columns:1fr;grid-auto-rows:1fr;min-height:0}
.tb .r{display:flex;justify-content:space-between;align-items:center;padding:0 calc(var(--u)*3);border-bottom:1px solid rgba(var(--txtrgb),.08);font-size:min(5.6cqh,calc(var(--u)*10));font-weight:700}
.tb .r:last-child{border-bottom:0}
.tb .r .t{color:var(--acc);font-weight:900}
.tb .r.nx{background:rgba(var(--accrgb),.2);border-radius:calc(var(--u)*3);box-shadow:0 0 0 1.5px var(--acc) inset}
.tb .r.ps{opacity:.5}
.wide .tb .rows{grid-template-columns:repeat(3,1fr)}
.wide .tb .r{flex-direction:column;justify-content:center;gap:.1em;border-bottom:0;font-size:min(11cqh,4.4cqw)}
.strip .tb .hd{display:none}
.strip .tb .rows{grid-template-columns:repeat(6,1fr)}
.strip .tb .r{flex-direction:column;justify-content:center;gap:.05em;border-bottom:0;font-size:min(22cqh,3.1cqw);padding:0}
.strip .in.tb{padding:calc(var(--u)*5) calc(var(--u)*4)}
/* clock */
.ck .big{font-size:calc(var(--u)*21);font-weight:900;direction:ltr;font-variant-numeric:tabular-nums;line-height:1;display:flex;align-items:baseline;gap:.08em}
.ck .big small{font-size:.38em;color:var(--acc);font-weight:900}
.ck .dy{font-size:calc(var(--u)*10);font-weight:900}
.ck .dt{font-size:calc(var(--u)*6);color:var(--acc);font-weight:700}
.wide .in.ck{flex-direction:row;justify-content:space-around}
.in.ck .col{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2)}
.wide .ck .big{font-size:calc(var(--u)*34)}.wide .ck .dy{font-size:calc(var(--u)*15)}.wide .ck .dt{font-size:calc(var(--u)*8)}
.strip .in.ck{flex-direction:row;justify-content:space-around;padding:calc(var(--u)*6) calc(var(--u)*10)}
.strip .ck .big{font-size:calc(var(--u)*44)}.strip .ck .dy{font-size:calc(var(--u)*24)}.strip .ck .dt{font-size:calc(var(--u)*15)}.strip .ck .g{display:none}
/* hijri */
.hj .hn{font-size:calc(var(--u)*34);font-weight:900;color:var(--acc);line-height:1}
.hj .mn{font-size:calc(var(--u)*12);font-weight:900;line-height:1.1}
.hj .yr{font-size:calc(var(--u)*7);font-weight:700;opacity:.9}
.hj .gr{font-size:calc(var(--u)*6);font-weight:500;opacity:.85}
.hj .dy{font-size:calc(var(--u)*8);font-weight:900;color:var(--acc)}
.wide .in.hj{flex-direction:row;justify-content:space-around}
.in.hj .col{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2)}
.wide .hj .hn{font-size:calc(var(--u)*58)}.wide .hj .mn{font-size:calc(var(--u)*20)}.wide .hj .yr{font-size:calc(var(--u)*11)}.wide .hj .gr{font-size:calc(var(--u)*9)}.wide .hj .dy{font-size:calc(var(--u)*13)}
.strip .in.hj{flex-direction:row;justify-content:space-around;padding:calc(var(--u)*6) calc(var(--u)*10)}
.strip .hj .hn{font-size:calc(var(--u)*62)}.strip .hj .mn{font-size:calc(var(--u)*34)}.strip .hj .yr{font-size:calc(var(--u)*22)}.strip .hj .gr,.strip .hj .dy{display:none}
/* dhikr */
.in.dh{padding:calc(var(--u)*8)}
.dh .orn{width:30%;height:2px;background:var(--acc);opacity:.6;border-radius:2px;flex:none}
.dh .tx{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dh .tx span{display:block;font-weight:700;line-height:1.7;animation:fi .8s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
/* full */
.fl .top{display:flex;justify-content:space-between;align-items:center;width:100%;flex:none}
.fl .clk{font-size:calc(var(--u)*13);white-space:nowrap;font-weight:900;direction:ltr;font-variant-numeric:tabular-nums}
.fl .clk small{font-size:.45em;color:var(--acc)}
.fl .hjd{font-size:calc(var(--u)*5);color:var(--acc);font-weight:700;text-align:left}
.fl .nxt{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:calc(var(--u)*.5);width:100%;flex:none;background:rgba(var(--accrgb),.16);border-radius:calc(var(--u)*4);padding:calc(var(--u)*2) calc(var(--u)*4);box-shadow:0 0 0 1.5px var(--acc) inset}
.fl .nxt .a{font-size:calc(var(--u)*8);font-weight:900;white-space:nowrap}.fl .nxt .a small{display:block;font-size:.5em;color:var(--acc);font-weight:700}
.fl .nxt .b{font-size:calc(var(--u)*11);white-space:nowrap;font-weight:900;direction:ltr;font-variant-numeric:tabular-nums}
.fl .rows{flex:1;min-height:0;width:100%;display:grid;grid-auto-rows:1fr}
.fl .r{display:flex;justify-content:space-between;align-items:center;padding:0 calc(var(--u)*3);border-bottom:1px solid rgba(var(--txtrgb),.08);font-size:min(4.4cqh,calc(var(--u)*8));font-weight:700}
.fl .r .t{color:var(--acc);font-weight:900}.fl .r.nx{color:var(--acc)}.fl .r.ps{opacity:.5}

<script>
(function () {

// ✏️ ===== إعدادات قابلة للتعديل =====

// ====================================
var DHIKR = ["{فَاذْكُرُونِي أَذْكُرْكُمْ}", "{وَاسْتَغْفِرُوا اللَّهَ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ}", "{أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ}", "{إِنَّ اللَّهَ مَعَ الصَّابِرِينَ}", "{ادْعُونِي أَسْتَجِبْ لَكُمْ}", "{وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ}", "{إِنَّ رَبِّي قَرِيبٌ مُّجِيبٌ}", "{وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ}", "{فَاِنَّ مَعَ الْعُسْرِ يُسْرًا}", "{وَقُل رَّبِّ زِدْنِي عِلْمًا}", "{لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا}", "{رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً}", "{وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ}", "{إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ}", "{قُلْ هُوَ اللَّهُ أَحَدٌ}", "سبحان الله وبحمده، سبحان الله العظيم", "لا إله إلا الله وحده لا شريك له", "الحمد لله حمداً كثيراً طيباً مباركاً فيه", "الله أكبر كبيراً، والحمد لله كثيراً", "لا حول ولا قوة إلا بالله", "استغفر الله واتوب إليه", "اللهم صلِّ وسلم على نبينا محمد", "سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر", "يا حي يا قيوم برحمتك أستغيث", "لا إله إلا أنت سبحانك إني كنت من الظالمين", "رضيت بالله رباً، وبالإسلام ديناً، وبمحمد نبيناً", "حسبنا الله ونعم الوكيل", "اللهم إنك عفو كريم تحب العفو فاعفُ عني", "اللهم اهدني وسددني", "بسم الله الذي لا يضر مع اسمه شيء", "اللهم إنك عفو تحب العفو فاعفُ عني", "ربي اغفر لي وتب عليّ إنك أنت التواب الرحيم"];
var CITIES = [["madinah","المدينة المنورة",24.5247,39.5692],["makkah","مكة المكرمة",21.3891,39.8579],["riyadh","الرياض",24.7136,46.6753],["jeddah","جدة",21.5433,39.1728],["dammam","الدمام",26.4207,50.0888],["khobar","الخبر",26.2172,50.1971],["qatif","القطيف",26.5196,50.0115],["jubail","الجبيل",27.0046,49.6460],["ahsa","الأحساء (الهفوف)",25.3648,49.5870],["taif","الطائف",21.2703,40.4158],["yanbu","ينبع",24.0895,38.0618],["tabuk","تبوك",28.3838,36.5550],["buraidah","بريدة",26.3260,43.9750],["unaizah","عنيزة",26.0840,43.9937],["hail","حائل",27.5114,41.7208],["hafar","حفر الباطن",28.4328,45.9708],["arar","عرعر",30.9753,41.0381],["sakaka","سكاكا",29.9697,40.2064],["baha","الباحة",20.0129,41.4677],["abha","أبها",18.2164,42.5053],["khamis","خميس مشيط",18.3000,42.7333],["najran","نجران",17.4917,44.1322],["jazan","جازان",16.8892,42.5611]];
var ORDER = ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
var NAMES = {Fajr:'الفجر',Sunrise:'الشروق',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
var CARDS = {next:'الصلاة القادمة',table:'جدول اليوم',clock:'الساعة والتاريخ',hijri:'التاريخ الهجري',dhikr:'ذكر',full:'لوحة كاملة'};
var SIZES = {'2x2':[1,380],'4x2':[2,640],'4x1':[4,720],'2x4':[0.5,380],'4x4':[1,640],'full':[0,0]};
var THEMES = {auto:'حسب التطبيق','default':'الحالي',emerald:'الزمرد',dusk:'الغسق',dark:'الداكن',light:'الفاتح'};
var DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

function ls(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lss(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function lsj(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function cityById(id){ for (var i=0;i<CITIES.length;i++) if (CITIES[i][0]===id) return CITIES[i]; return null; }

// ---------- إعدادات من الرابط ----------
function readCfg(search){
  var q = new URLSearchParams(search), c = {};
  c.card  = CARDS[q.get('card')] ? q.get('card') : '';
  c.size  = (SIZES[q.get('size')] || q.get('size')==='custom') ? q.get('size') : '2x2';
  var w = parseInt(q.get('w'),10) || 0, h = parseInt(q.get('h'),10) || 0;
  c.w = w ? Math.max(120, Math.min(2000, w)) : 0;
  c.h = h ? Math.max(60,  Math.min(2000, h)) : 0;
  if (c.size==='custom' && !(c.w && c.h)) c.size = '2x2';
  if (c.w && c.h && !q.get('size')) c.size = 'custom';
  c.theme = THEMES[q.get('theme')] ? q.get('theme') : 'auto';
  c.city  = cityById(q.get('city')) ? q.get('city') : 'auto';
  c.digits = q.get('digits') === 'ar' ? 'ar' : 'en';
  c.clear = q.get('bg') === 'clear';
  return c;
}
function toQuery(c){
  var p = [];
  if (c.card) p.push('card='+c.card);
  p.push('size='+c.size);
  if (c.size==='custom'){ p.push('w='+c.w); p.push('h='+c.h); }
  if (c.theme!=='auto') p.push('theme='+c.theme);
  if (c.city!=='auto') p.push('city='+c.city);
  if (c.digits==='ar') p.push('digits=ar');
  if (c.clear) p.push('bg=clear');
  return p.join('&');
}

// ---------- البيانات ----------
var KEYS6 = ORDER;
function normDay(d){
  if (!d || !d.timings || !d.date || !d.date.hijri) return null;
  var t = {};
  for (var i=0;i<KEYS6.length;i++){
    var m = /^(\d{1,2}):(\d{2})/.exec(String(d.timings[KEYS6[i]]||''));
    if (!m || +m[1]>23 || +m[2]>59) return null;
    t[KEYS6[i]] = [+m[1], +m[2]];
  }
  var h = d.date.hijri;
  return { t:t, h:{ d:parseInt(h.day,10), m:String((h.month&&h.month.ar)||'').slice(0,30), y:String(h.year||'').slice(0,4) } };
}
function cityFor(c){
  var id = c.city !== 'auto' ? c.city : (ls('P_CITY_V30') || DEFAULT_CITY);
  return cityById(id) || cityById(DEFAULT_CITY);
}
var MEM = {};   // 'cityid|YYYY-M' -> days[]
function monthKey(city,y,m){ return city[0]+'|'+y+'-'+m; }
function fromMaster(city,y,m){
  var meta = lsj('P_META_V30'), raw = lsj('P_MASTER_V30');
  if (!meta || !raw || meta.city!==city[0] || meta.year!==y || !raw[String(m)]) return null;
  var out = [], arr = raw[String(m)];
  for (var i=0;i<arr.length;i++){ var n = normDay(arr[i]); if (!n) return null; out.push(n); }
  return out;
}
function fromOwn(city,y,m){
  var c = lsj('W_CACHE_V1');
  var a = c && c[monthKey(city,y,m)];
  return Array.isArray(a) && a.length>=28 ? a : null;
}
function saveOwn(city,y,m,days){
  var c = lsj('W_CACHE_V1') || {};
  c[monthKey(city,y,m)] = days;
  var ks = Object.keys(c);
  while (ks.length>6){ delete c[ks.shift()]; }   // نحتفظ بآخر ٦ أشهر فقط
  lss('W_CACHE_V1', JSON.stringify(c));
}
function getMonth(city,y,m){
  var k = monthKey(city,y,m);
  return MEM[k] || (MEM[k] = (fromMaster(city,y,m) || fromOwn(city,y,m)));
}
var inflight = {};
function ensureMonth(city,y,m){
  if (getMonth(city,y,m)) return Promise.resolve(true);
  var k = monthKey(city,y,m);
  if (inflight[k]) return inflight[k];
  var url = 'https://api.aladhan.com/v1/calendar/'+y+'/'+m+'?latitude='+city[2]+'&longitude='+city[3]+'&method=4&calendarMethod=UAQ&timezonestring='+encodeURIComponent(TIMEZONE);
  inflight[k] = fetch(url,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'}).then(function(r){
    if(!r.ok) throw new Error('http'); return r.json();
  }).then(function(j){
    if(!j || j.code!==200 || !Array.isArray(j.data) || j.data.length<28) throw new Error('bad');
    var f = j.data[0].meta && j.data[0].meta.method;
    if(!f || f.id!==4) throw new Error('method');   // أم القرى فقط
    var days = j.data.map(normDay);
    if (days.some(function(x){return !x;})) throw new Error('norm');
    MEM[k] = days; saveOwn(city,y,m,days); return true;
  }).catch(function(){ return false; }).then(function(ok){ delete inflight[k]; return ok; });
  return inflight[k];
}
function dayOf(city,date){
  var a = getMonth(city,date.getFullYear(),date.getMonth()+1);
  return a ? a[date.getDate()-1] || null : null;
}
function adhanOff(){
  var o = lsj('P_OFFSETS_V30'), r = {};
  KEYS6.forEach(function(k){ var v = o && o.adhan ? Number(o.adhan[k]) : 0; r[k] = isFinite(v) ? Math.max(-180,Math.min(180,Math.round(v))) : 0; });
  return r;
}
function addDays(d,n){ var x = new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); return x; }
function model(city,now){
  var day = dayOf(city,now); if (!day) return null;
  var off = adhanOff(), fri = now.getDay()===5, ev = [];
  KEYS6.forEach(function(k){
    var t = day.t[k];
    ev.push({k:k, name:(k==='Dhuhr'&&fri)?'الجمعة':NAMES[k], at:new Date(now.getFullYear(),now.getMonth(),now.getDate(),t[0],t[1]+off[k],0)});
  });
  var nx = null;
  for (var i=0;i<ev.length;i++) if (ev[i].at>now){ nx = ev[i]; break; }
  if (!nx){
    var tm = addDays(now,1), d2 = dayOf(city,tm);
    if (d2){ var t2 = d2.t.Fajr; nx = {k:'Fajr', name:NAMES.Fajr, at:new Date(tm.getFullYear(),tm.getMonth(),tm.getDate(),t2[0],t2[1]+off.Fajr,0), tomorrow:true}; }
  }
  ev.forEach(function(e){ e.next = nx && !nx.tomorrow && e.k===nx.k; e.past = e.at<=now; });
  return {day:day, ev:ev, next:nx, now:now, city:city};
}

// ---------- التنسيق ----------
var DIG = 'en';
function dg(s){ s = String(s); if (DIG!=='ar') return s; return s.replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.charAt(+d);}); }
function pad(n){ return (n<10?'0':'')+n; }
function t12(d){ var h = d.getHours(), p = h>=12?'م':'ص'; return {t:dg(pad(h%12||12)+':'+pad(d.getMinutes())), p:p}; }
function t12s(d){ return '<span class="ltr">'+t12(d).t+'</span><span class="ap">'+t12(d).p+'</span>'; }
function cdText(ms){ if (ms<0) ms=0; var s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60); return dg(pad(h)+':'+pad(m)+':'+pad(s%60)); }
function gdate(d){
  try { return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-'+(DIG==='ar'?'arab':'latn'),{day:'numeric',month:'long',year:'numeric'}).format(d); }
  catch(e){ return d.toDateString(); }
}
function hdate(m){ return dg(m.day.h.d)+' '+m.day.h.m+' '+dg(m.day.h.y)+' هـ'; }

// ---------- بناء البطاقات ----------
function rowsHtml(m){
  return m.ev.map(function(e){ return '<div class="r'+(e.next?' nx':'')+(e.past&&!e.next?' ps':'')+'"><span class="n">'+esc(e.name)+'</span><span class="t">'+t12s(e.at)+'</span></div>'; }).join('');
}
var BUILD = {
  next:function(m){
    if(!m.next) return '<div class="in"><div class="msg">…</div></div>';
    var n = m.next, t = t12s(n.at);
    return '<div class="in nx"><div class="blk"><div class="lbl">الصلاة القادمة</div><div class="nm">'+esc(n.name)+'</div><div class="tm">'+t+'</div></div>'+
      '<div class="blk"><div class="cd" data-cd>'+cdText(n.at-m.now)+'</div><div class="sm">'+esc(hdate(m))+'</div></div></div>';
  },
  table:function(m){
    return '<div class="in tb"><div class="hd"><span>'+esc(m.city[1])+'</span><span>'+esc(DAYS[m.now.getDay()])+' '+esc(hdate(m))+'</span></div><div class="rows">'+rowsHtml(m)+'</div></div>';
  },
  clock:function(m){
    var t = t12(m.now);
    return '<div class="in ck"><div class="col"><div class="big"><span>'+t.t+'</span><small>'+t.p+'</small></div></div>'+
      '<div class="col"><div class="dy">'+esc(DAYS[m.now.getDay()])+'</div><div class="dt g">'+esc(gdate(m.now))+'</div><div class="dt">'+esc(hdate(m))+'</div></div></div>';
  },
  hijri:function(m){
    return '<div class="in hj"><div class="col"><div class="dy">'+esc(DAYS[m.now.getDay()])+'</div><div class="hn">'+dg(m.day.h.d)+'</div></div>'+
      '<div class="col"><div class="mn">'+esc(m.day.h.m)+'</div><div class="yr">'+dg(m.day.h.y)+' هـ</div><div class="gr">'+esc(gdate(m.now))+'</div></div></div>';
  },
  dhikr:function(m,slice){
    var s = DHIKR[slice % DHIKR.length] || '';
    return '<div class="in dh"><div class="orn"></div><div class="tx"><span data-fit>'+esc(s)+'</span></div><div class="orn"></div></div>';
  },
  full:function(m,slice){
    var n = m.next, t = t12(m.now), s = DHIKR[slice % DHIKR.length] || '';
    var top = '<div class="top"><div class="clk"><span>'+t.t+'</span> <small>'+t.p+'</small></div><div class="hjd">'+esc(DAYS[m.now.getDay()])+'<br>'+esc(hdate(m))+'</div></div>';
    var nxt = n ? '<div class="nxt"><div class="a"><small>الصلاة القادمة</small>'+esc(n.name)+' <span class="ltr">'+t12(n.at).t+'</span>'+t12(n.at).p+'</div><div class="b" data-cd>'+cdText(n.at-m.now)+'</div></div>' : '';
    var rows = '<div class="rows">'+rowsHtml(m)+'</div>';
    var ft = '<div class="ft">'+esc(s)+'</div>';
    return '<div class="in fl" data-full>'+top+nxt+rows+ft+'</div>';
  }
};
function fullWide(html){   // في الأشكال العريضة نقسم اللوحة الكاملة إلى عمودين
  var d = document.createElement('div'); d.innerHTML = html;
  var inn = d.firstChild, kids = [].slice.call(inn.children);
  var l = document.createElement('div'); l.className = 'l'; var r = document.createElement('div'); r.className = 'rr';
  kids.forEach(function(k){ (k.classList.contains('rows') ? r : (k.classList.contains('ft') ? l : l)).appendChild(k); });
  inn.appendChild(l); inn.appendChild(r); return inn.outerHTML;
}
function fitText(span){
  var box = span.parentNode, lo = 6, hi = Math.min(box.clientHeight, box.clientWidth)*0.6+10;
  if (!box.clientWidth || !box.clientHeight) return;
  for (var i=0;i<14;i++){
    var mid = (lo+hi)/2; span.style.fontSize = mid+'px';
    if (span.scrollHeight>box.clientHeight || span.scrollWidth>box.clientWidth) hi = mid; else lo = mid;
  }
  span.style.fontSize = lo+'px';
}

// ---------- الحاوية (ودجت واحد) ----------
var INST = [];
function themeOf(c){ var t = c.theme==='auto' ? (ls('P_THEME_V30')||'default') : c.theme; return /^[a-z]{3,12}$/.test(t) ? t : 'default'; }
function applyTheme(el,c){
  var t = themeOf(c);
  el.className = el.className.replace(/\bth-\w+/g,'').trim();
  if (t!=='default' && t!=='custom') el.classList.add('th-'+t);
  el.style.cssText = el.style.cssText.split(';').filter(function(x){return /^(width|height|border-radius)/.test(x.trim());}).join(';');
  if (t==='custom'){
    var cu = lsj('P_CUSTOM_V30'), cv = cu && cu.cv;
    if (cv && typeof cv==='object') for (var k in cv){
      if (/^--(dark-brown|accent-beige|text-cream|bg-rgb|glow-rgb|accent-rgb|text-rgb|on-accent)$/.test(k) && /^[#0-9a-zA-Z.,()% -]{1,60}$/.test(String(cv[k]))){
        var map = {'--dark-brown':'--bg','--accent-beige':'--acc','--text-cream':'--txt','--bg-rgb':'--bgrgb','--glow-rgb':'--glow','--accent-rgb':'--accrgb','--text-rgb':'--txtrgb','--on-accent':'--on'};
        el.style.setProperty(map[k], String(cv[k]));
      }
    }
  }
}
function boxSize(c, availW, availH){
  if (c.size==='full') return [availW, availH, 0];
  var r, maxW;
  if (c.size==='custom'){ r = c.w/c.h; maxW = c.w; } else { r = SIZES[c.size][0]; maxW = SIZES[c.size][1]; }
  var W = Math.min(availW, availH*r, maxW), H = W/r;
  return [W, H, Math.min(W,H)*0.09];
}
function Widget(mount, c, availFn){
  var self = this, el = document.createElement('div'); el.className = 'w';
  mount.appendChild(el); this.el = el; this.c = c; this.sig = ''; this.avail = availFn;
  this.layout = function(){
    var a = availFn(), b = boxSize(c,a[0],a[1]);
    el.style.width = b[0]+'px'; el.style.height = b[1]+'px'; el.style.borderRadius = b[2]+'px';
    var r = b[0]/b[1];
    el.classList.toggle('wide', r>1.6 && r<=3.2); el.classList.toggle('strip', r>3.2); el.classList.toggle('tall', r<0.8);
    el.classList.toggle('clear', !!c.clear);
    self.sig = '';
  };
  this.tick = function(now){
    var city = cityFor(c), m = model(city, now);
    if (!m){ var s='…'; if (self.sig!==s){ el.innerHTML = '<div class="in"><div class="msg">جارٍ تحميل المواقيت…</div></div>'; self.sig=s; ensureMonth(city,now.getFullYear(),now.getMonth()+1).then(function(){ self.sig=''; }); } return; }
    var slice = Math.floor(now.getTime()/(DHIKR_SECONDS*1000));
    var sig = c.card+'|'+now.getHours()+':'+now.getMinutes()+'|'+(m.next&&m.next.k)+'|'+(c.card==='dhikr'||c.card==='full'?slice:'')+'|'+el.className+'|'+el.style.width+'|'+DIG+'|'+themeOf(c);
    if (sig!==self.sig){
      self.sig = sig; applyTheme(el,c);
      var html = BUILD[c.card](m,slice);
      if (c.card==='full' && el.classList.contains('wide')) html = fullWide(html);
      el.innerHTML = html;
      var f = el.querySelector('[data-fit]'); if (f) requestAnimationFrame(function(){ fitText(f); });
      // تحميل الشهر القادم مسبقاً قرب نهاية الشهر
      var t = addDays(now,1); if (t.getMonth()!==now.getMonth()) ensureMonth(city,t.getFullYear(),t.getMonth()+1);
    }
    var cd = el.querySelectorAll('[data-cd]');
    for (var i=0;i<cd.length;i++) if (m.next) cd[i].textContent = cdText(m.next.at-now);
  };
  this.layout();
}
function tickAll(){ var now = new Date(); INST.forEach(function(w){ w.tick(now); }); }
function relayoutAll(){ INST.forEach(function(w){ w.layout(); }); tickAll(); }
var timer = null;
function start(){ if (!timer){ timer = setInterval(tickAll,1000); window.addEventListener('resize',relayoutAll); window.addEventListener('orientationchange',function(){ setTimeout(relayoutAll,200); }); } tickAll(); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ INST.forEach(function(w){w.sig='';}); tickAll(); } });

// ---------- وضع العرض (ودجت بملء الصفحة) ----------
function runMode(c){
  document.body.className = 'run'+(c.clear?' clear':'');
  DIG = c.digits;
  var themeColor = {emerald:'#06130e',dusk:'#0a0e1f',dark:'#0a0a0c',light:'#f4efe4'}[themeOf(c)] || '#120e0b';
  var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = themeColor;
  var w = new Widget(document.body, c, function(){ var p = c.size==='full'?0:10; return [window.innerWidth-2*p, window.innerHeight-2*p]; });
  INST.push(w);
  try { if (navigator.wakeLock && ls('P_WAKE_V30')==='1') navigator.wakeLock.request('screen').catch(function(){}); } catch(e){}
  start();
}

  function chips(id, obj, key, cb){
